<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>itsquasi</title>

  <link rel="icon" type="icon" href="assets/images/icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/tailwind.css">
</head>

<body class="min-h-screen flex items-center justify-center">

  <!-- Start -->

  <canvas id="binary-grid"></canvas>

  <div class="text-center">

    <div class="button-tab flex justify-center gap-0.5 px-1 mb-0.5">
      <button id="home-btn">home</button>
      <button id="clock-btn">clock</button>
      <button id="settings-btn">settings</button>
    </div>

    <div class="glass p-1 md:p-2">
      <div id="home-content">
        <h1 class="text-5xl md:text-7xl font-bold">itsquasi</h1>
        <div class="mt-0.5 flex justify-center gap-1">
          <a href="https://itsquasiab.github.io/uilib/">uilib</a>
          <a href="https://github.com/itsquasiab/">github</a>
          <a href="https://coderheck.pages.dev/">friend</a>
        </div>
      </div>
      <div id="clock-content" class="hidden">
        <h1 id="time" class="text-5xl md:text-7xl font-bold"></h1>
        <p id="date" class="pt-0.5"></p>
      </div>
      <div id="settings-content">
        <div id="settings-page">
          <div class="button-container grid grid-cols-2">
            <button id="appearance-btn">appearance</button>
            <button id="about-btn">about</button>
          </div>
          <div id="appearance-page">
            <p class="my-0.5 font-bold">color:</p>
            <div class="grid grid-cols-2 gap-0.5">
              <button class="color-btn color-light_blue" data-color="light_blue">
                <span class="color light-blue"></span>eva
              </button>
              <button class="color-btn color-blue" data-color="blue">
                <span class="color blue"></span>lexon
              </button>
              <button class="color-btn color-purple" data-color="purple">
                <span class="color purple"></span>veyrix
              </button>
              <button class="color-btn color-pink" data-color="pink">
                <span class="color pink"></span>kayla
              </button>
              <button class="color-btn color-red" data-color="red">
                <span class="color red"></span>tyra
              </button>
              <button class="color-btn color-orange" data-color="orange">
                <span class="color orange"></span>flarence
              </button>
              <button class="color-btn color-yellow" data-color="yellow">
                <span class="color yellow"></span>trixie
              </button>
              <button class="color-btn color-green" data-color="green">
                <span class="color green"></span>zyren
              </button>
            </div>
            <p class="accent text-sm">these color name may have been inspired</p>
            <p class="my-0.5 font-bold">color mode:</p>
            <div class="flex justify-center gap-0.5">
              <button id="light-btn">light</button>
              <button id="dark-btn">dark</button>
              <button id="system-btn">system</button>
            </div>
          </div>
          <div id="about-page" class="hidden pt-0.5">
            <p class="mt-0.5 accent">hi there, have a great day!</p>
            <p class="my-0.5 font-bold">about this webpage:</p>
            <p>a personal webpage made by itsquasi.</p>
          </div>
        </div>
      </div>

    </div>

    <!-- End -->

    <script src="assets/js/main.js"></script>
    <script src="assets/js/binary_grid_time.js"></script>
</body>

</html>
